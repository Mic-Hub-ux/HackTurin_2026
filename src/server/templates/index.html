<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efesto | Smart Crossing Command Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    // Custom colors to match CartoDB nice dark blue/black
                    colors: {
                        'carto-dark': '#1a1a1a' 
                    }
                }
            }
        }
    </script>
    <!-- Inter Font & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Ensure map fills container */
        #map { height: 100%; width: 100%; }
        
        /* --- Leaflet Customization for Dark Mode --- */
        
        /* Invert the standard tiles for a basic dark map if not using CartoDB */
        .dark .leaflet-tile-pane {
            /* filter: brightness(0.6) invert(1) contrast(3) hue-rotate(180deg) saturate(0.3) !important; */
        }
        
        /* Style Popups to match theme */
        .leaflet-popup-content-wrapper {
            border-radius: 0.75rem !important; /* rounded-xl */
            padding: 0 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05) !important;
        }
        .dark .leaflet-popup-content-wrapper,
        .dark .leaflet-popup-tip {
            background-color: #1f2937 !important; /* bg-gray-800 */
            color: #f3f4f6 !important; /* text-gray-100 */
        }
        .leaflet-popup-content {
            margin: 0 !important;
        }
        .leaflet-container a.leaflet-popup-close-button {
            color: #9ca3af !important; /* text-gray-400 */
            padding: 10px 12px 0 0 !important;
        }
        .dark .leaflet-control-attribution,
        .dark .leaflet-control-attribution a {
            background-color: rgba(26, 26, 26, 0.7) !important;
            color: #a3a3a3 !important;
        }
    </style>
</head>
<body class="h-full flex overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans transition-colors duration-300">

    <!-- Sidebar Control Center -->
    <aside class="w-96 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-10 shadow-xl transition-colors duration-300">
        <!-- Header -->
        <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 dark:text-white text-lg tracking-tight">Efesto</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Turin Smart Crossing</p>
                </div>
            </div>
            <!-- Theme Toggle -->
            <button id="themeToggleBtn" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                <i data-lucide="moon" class="w-5 h-5" id="themeIcon"></i>
            </button>
        </div>

        <!-- Scrollable Controls -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Live Status Banner -->
            <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900/50 flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <div class="text-xs">
                    <p class="font-semibold text-emerald-900 dark:text-emerald-300">System Live & Synchronized</p>
                    <p class="text-emerald-700 dark:text-emerald-400">Monitoring IoT peer nodes across Turin.</p>
                </div>
            </div>

            <!-- Search Field -->
            <div class="space-y-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Search Peer Node</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="nodeSearch" placeholder="e.g. node_01" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- Category Toggles -->
            <div class="space-y-3">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Traffic Layers</label>
                
                <div class="space-y-2">
                    <!-- Pedestrians -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400"><i data-lucide="user" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Pedestrians</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterPedestrians" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <!-- Cyclists -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400"><i data-lucide="bike" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Cyclists</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterCyclists" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                        </label>
                    </div>

                    <!-- Ambulances -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400"><i data-lucide="ambulance" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Ambulances</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterAmbulances" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-600"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Data Credits (Optional, looks professional) -->
            <div class="text-center text-xs text-slate-400 dark:text-slate-600 pt-4 border-t border-slate-100 dark:border-slate-800">
                Map tiles by <a href="https://carto.com/" target="_blank" class="hover:text-blue-500">CartoDB</a> under CC BY 3.0. Data by OpenStreetMap.
            </div>
        </div>
    </aside>

    <!-- Map Viewport -->
    <main class="flex-1 h-full relative z-0">
        <div id="map"></div>
    </main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        lucide.createIcons();

        // --- MAP CONFIGURATION (OpenStreetMap pulito senza API Key) ---
        const voyagerLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd'
        });

        const map = L.map('map', { 
            zoomControl: false,
            layers: [voyagerLayer]
        }).setView([45.0703, 7.6869], 14);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Theme Toggle Logic con filtro CSS dark mode per la mappa
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const mapContainer = document.getElementById('map');

        // Controlla se la dark mode è attiva all'avvio
        const isInitialDark = document.documentElement.classList.contains('dark');
        if (isInitialDark) {
            mapContainer.style.filter = 'invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%)';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();

            // Applica o rimuove il filtro scuro sulla mappa in modo fluido
            if (isDark) {
                mapContainer.style.filter = 'invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%)';
            } else {
                mapContainer.style.filter = 'none';
            }
        });

        // --- MARKER LOGIC ---
        let markers = {};

        // Define custom icons to match the clean aesthetic
        const createCountIcon = (colorClass) => {
            return L.divIcon({
                html: `<div class="w-4 h-4 rounded-full border-2 border-white shadow-lg ${colorClass} animate-pulse"></div>`,
                className: '', // Remove default leaflet-div-icon styles
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
        };

        const iconMap = {
            pedestrians: createCountIcon('bg-blue-500'),
            cyclists: createCountIcon('bg-emerald-500'),
            ambulances: createCountIcon('bg-rose-500')
        };

        // Determine which icon to show based on priority (Ambulance > Cyclist > Pedestrian)
        function getMarkerIcon(counts) {
            if (counts.ambulances > 0) return iconMap.ambulances;
            if (counts.cyclists > 5) return iconMap.cyclists; // Only highlight if > 5
            return iconMap.pedestrians;
        }

        function fetchTrafficData() {
            fetch('/api/traffic')
                .then(res => res.json())
                .then(data => {
                    const searchQuery = document.getElementById('nodeSearch').value.toLowerCase();
                    const showPed = document.getElementById('filterPedestrians').checked;
                    const showCyc = document.getElementById('filterCyclists').checked;
                    const showAmb = document.getElementById('filterAmbulances').checked;

                    // Remove markers for nodes that are filtered out by text search
                    Object.keys(markers).forEach(id => {
                        if (searchQuery && !id.toLowerCase().includes(searchQuery)) {
                            map.removeLayer(markers[id]);
                            delete markers[id];
                        }
                    });

                    data.forEach(node => {
                        const nodeId = node.node_id.toLowerCase();
                        
                        // Apply text search filter
                        if (searchQuery && !nodeId.includes(searchQuery)) return;

                        // Apply category visibility filters (if none are checked, hide all)
                        let visible = false;
                        if (showPed && node.counts.pedestrians > 0) visible = true;
                        if (showCyc && node.counts.cyclists > 0) visible = true;
                        if (showAmb && node.counts.ambulances > 0) visible = true;
                        
                        if (!visible && showPed === false && showCyc === false && showAmb === false) {
                            // keep hidden if filters exist
                        } else if (!visible) {
                             if (markers[node.node_id]) {
                                map.removeLayer(markers[node.node_id]);
                                delete markers[node.node_id];
                            }
                            return;
                        }

                        const lat = node.coordinates.lat;
                        const lon = node.coordinates.lon;
                        const counts = node.counts;

                        // Build elegant popup HTML
                        let metricsHtml = `
                            <div class="min-w-[160px] font-sans overflow-hidden">
                                <div class="px-4 py-3 bg-slate-50 dark:bg-slate-700/50 border-b border-slate-100 dark:border-slate-600">
                                    <h3 class="font-bold text-slate-900 dark:text-white text-sm">Node ${node.node_id}</h3>
                                    <p class="text-xs text-slate-500 dark:text-slate-300">Live Counts</p>
                                </div>
                                <div class="p-3 space-y-2.5">
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-slate-600 dark:text-slate-300 flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5 text-blue-500"></i>Pedestrians</span>
                                        <span class="font-bold text-slate-900 dark:text-white">${counts.pedestrians}</span>
                                    </div>
                                    <div class="flex items-center justify-between text-xs">
                                        <span class="text-slate-600 dark:text-slate-300 flex items-center gap-1.5"><i data-lucide="bike" class="w-3.5 h-3.5 text-emerald-500"></i>Cyclists</span>
                                        <span class="font-bold text-slate-900 dark:text-white">${counts.cyclists}</span>
                                    </div>
                                    ${counts.ambulances > 0 ? `
                                    <div class="flex items-center justify-between text-xs pt-1.5 border-t border-slate-100 dark:border-slate-600">
                                        <span class="font-semibold text-rose-600 dark:text-rose-400 flex items-center gap-1.5"><i data-lucide="ambulance" class="w-3.5 h-3.5"></i>Ambulances</span>
                                        <span class="font-bold text-rose-600 dark:text-rose-400">${counts.ambulances}</span>
                                    </div>` : ''}
                                </div>
                            </div>
                        `;

                        const selectedIcon = getMarkerIcon(counts);

                        if (markers[node.node_id]) {
                            // Update position
                            markers[node.node_id].setLatLng([lat, lon]);
                            // Update icon (it might change based on counts)
                            markers[node.node_id].setIcon(selectedIcon);
                            // Update popup content only if it's already open (prevents flickering)
                            const popup = markers[node.node_id].getPopup();
                            if (popup && popup.isOpen()) {
                                popup.setContent(metricsHtml);
                            }
                        } else {
                            // Create new marker with custom icon
                            const marker = L.marker([lat, lon], { icon: selectedIcon }).addTo(map);
                            marker.bindPopup(metricsHtml);

                            // Open popup on hover
                            marker.on('mouseover', function () {
                                this.openPopup();
                            });
                            marker.on('mouseout', function () {
                                // NOTE: Normally we'd close on mouseout, but if they want to click
                                // something inside the popup, this is bad. Keep open for now.
                                // this.closePopup();
                            });

                            markers[node.node_id] = marker;
                        }
                    });
                    // Re-run icon engine for popup icons
                    lucide.createIcons();
                })
                .catch(err => console.error('Error fetching data:', err));
        }

        // Poll server every 2 seconds for real-time updates
        setInterval(fetchTrafficData, 2000);
        fetchTrafficData();

        // Event Listeners for filters
        document.getElementById('nodeSearch').addEventListener('input', fetchTrafficData);
        document.getElementById('filterPedestrians').addEventListener('change', fetchTrafficData);
        document.getElementById('filterCyclists').addEventListener('change', fetchTrafficData);
        document.getElementById('filterAmbulances').addEventListener('change', fetchTrafficData);
    </script>
</body>
</html>
