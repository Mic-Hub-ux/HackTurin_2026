<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crossing - Turin Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Right Sidebar for Controls & Filters -->
    <div id="sidebar">
        <h2>Smart Turin</h2>
        <div class="stats-box">
            Real-time urban monitoring dashboard tracking pedestrian, cyclist, and emergency flows across active peer nodes.
        </div>

        <div class="filter-group">
            <label for="nodeSearch">Search Peer ID</label>
            <input type="text" id="nodeSearch" placeholder="e.g. node_01">
        </div>

        <div class="filter-group">
            <label>Traffic Categories</label>
            <div class="toggle-container">
                <div class="toggle-row">
                    <span class="toggle-label">🚶 Pedestrians</span>
                    <label class="switch">
                        <input type="checkbox" id="filterPedestrians" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">🚴 Cyclists</span>
                    <label class="switch">
                        <input type="checkbox" id="filterCyclists" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">🚑 Ambulances</span>
                    <label class="switch">
                        <input type="checkbox" id="filterAmbulances" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Left Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([45.0703, 7.6869], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};

        function fetchTrafficData() {
            fetch('/api/traffic')
                .then(response => response.json())
                .then(data => {
                    const searchQuery = document.getElementById('nodeSearch').value.toLowerCase();
                    const showPed = document.getElementById('filterPedestrians').checked;
                    const showCyc = document.getElementById('filterCyclists').checked;
                    const showAmb = document.getElementById('filterAmbulances').checked;

                    data.forEach(node => {
                        const nodeId = node.node_id.toLowerCase();
                        
                        if (searchQuery && !nodeId.includes(searchQuery)) {
                            if (markers[node.node_id]) {
                                map.removeLayer(markers[node.node_id]);
                                delete markers[node.node_id];
                            }
                            return;
                        }

                        const lat = node.coordinates.lat;
                        const lon = node.coordinates.lon;
                        const counts = node.counts;

                        let metricsHtml = `<b>Node ID:</b> ${node.node_id}<br><hr style="margin: 5px 0; border:0; border-top:1px solid #ddd;">`;
                        if (showPed) metricsHtml += `🚶 Pedestrians: <b>${counts.pedestrians}</b><br>`;
                        if (showCyc) metricsHtml += `🚴 Cyclists: <b>${counts.cyclists}</b><br>`;
                        if (showAmb) metricsHtml += `🚑 Ambulances: <b>${counts.ambulances}</b><br>`;

                        if (markers[node.node_id]) {
                            markers[node.node_id].setLatLng([lat, lon]);
                            const popup = markers[node.node_id].getPopup();
                            if (popup) {
                                popup.setContent(metricsHtml);
                            }
                        } else {
                            const marker = L.marker([lat, lon]).addTo(map);
                            marker.bindPopup(metricsHtml);

                            marker.on('mouseover', function () {
                                this.openPopup();
                            });
                            marker.on('mouseout', function () {
                                this.closePopup();
                            });

                            markers[node.node_id] = marker;
                        }
                    });
                })
                .catch(error => console.error('Error fetching traffic data:', error));
        }

        setInterval(fetchTrafficData, 2000);
        fetchTrafficData();

        document.getElementById('nodeSearch').addEventListener('input', fetchTrafficData);
        document.getElementById('filterPedestrians').addEventListener('change', fetchTrafficData);
        document.getElementById('filterCyclists').addEventListener('change', fetchTrafficData);
        document.getElementById('filterAmbulances').addEventListener('change', fetchTrafficData);
    </script>
</body>
</html>
