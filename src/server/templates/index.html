<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efesto | Smart Crossing Command Center</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Inter Font & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="h-full flex overflow-hidden bg-slate-100 dark:bg-slate-950 font-sans transition-colors duration-300">

    <!-- Sidebar Control Center -->
    <aside class="w-96 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col z-10 shadow-xl transition-colors duration-300">
        <!-- Header -->
        <div class="p-6 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 dark:text-white text-lg tracking-tight">Efesto</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Turin Smart Crossing</p>
                </div>
            </div>
            <!-- Theme Toggle -->
            <button id="themeToggleBtn" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all">
                <i data-lucide="moon" class="w-5 h-5" id="themeIcon"></i>
            </button>
        </div>

        <!-- Scrollable Controls -->
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- Live Status Banner -->
            <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-900/50 flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <div class="text-xs">
                    <p class="font-semibold text-emerald-900 dark:text-emerald-300">System Live & Synchronized</p>
                    <p class="text-emerald-700 dark:text-emerald-400">Monitoring IoT peer nodes across Turin.</p>
                </div>
            </div>

            <!-- Search Field -->
            <div class="space-y-2">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Search Peer Node</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </span>
                    <input type="text" id="nodeSearch" placeholder="e.g. node_01" 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                </div>
            </div>

            <!-- Category Toggles -->
            <div class="space-y-3">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Traffic Layers</label>
                
                <div class="space-y-2">
                    <!-- Pedestrians -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400"><i data-lucide="user" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Pedestrians</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterPedestrians" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                        </label>
                    </div>

                    <!-- Cyclists -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400"><i data-lucide="bike" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Cyclists</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterCyclists" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
                        </label>
                    </div>

                    <!-- Ambulances -->
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="p-2 rounded-lg bg-rose-50 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400"><i data-lucide="ambulance" class="w-4 h-4"></i></div>
                            <span class="text-sm font-medium text-slate-700 dark:text-slate-200">Ambulances</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="filterAmbulances" class="sr-only peer" checked>
                            <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-rose-600"></div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Map Viewport -->
    <main id="map" class="flex-1 h-full relative z-0"></main>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        lucide.createIcons();

        const map = L.map('map', { zoomControl: false }).setView([45.0703, 7.6869], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Theme Toggle
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        let markers = {};

        function fetchTrafficData() {
            fetch('/api/traffic')
                .then(res => res.json())
                .then(data => {
                    const searchQuery = document.getElementById('nodeSearch').value.toLowerCase();
                    const showPed = document.getElementById('filterPedestrians').checked;
                    const showCyc = document.getElementById('filterCyclists').checked;
                    const showAmb = document.getElementById('filterAmbulances').checked;

                    data.forEach(node => {
                        const nodeId = node.node_id.toLowerCase();
                        if (searchQuery && !nodeId.includes(searchQuery)) {
                            if (markers[node.node_id]) {
                                map.removeLayer(markers[node.node_id]);
                                delete markers[node.node_id];
                            }
                            return;
                        }

                        const lat = node.coordinates.lat;
                        const lon = node.coordinates.lon;
                        const counts = node.counts;

                        let metricsHtml = `<div class="p-2 font-sans"><b class="text-slate-900 text-sm">Node: ${node.node_id}</b><hr class="my-1.5 border-slate-200">`;
                        if (showPed) metricsHtml += `<div class="text-xs text-slate-700 py-0.5">🚶 Pedestrians: <b>${counts.pedestrians}</b></div>`;
                        if (showCyc) metricsHtml += `<div class="text-xs text-slate-700 py-0.5">🚴 Cyclists: <b>${counts.cyclists}</b></div>`;
                        if (showAmb) metricsHtml += `<div class="text-xs text-rose-600 py-0.5 font-semibold">🚑 Ambulances: <b>${counts.ambulances}</b></div>`;
                        metricsHtml += `</div>`;

                        if (markers[node.node_id]) {
                            markers[node.node_id].setLatLng([lat, lon]);
                            const popup = markers[node.node_id].getPopup();
                            if (popup) popup.setContent(metricsHtml);
                        } else {
                            const marker = L.marker([lat, lon]).addTo(map);
                            marker.bindPopup(metricsHtml);
                            marker.on('mouseover', function () { this.openPopup(); });
                            marker.on('mouseout', function () { this.closePopup(); });
                            markers[node.node_id] = marker;
                        }
                    });
                })
                .catch(err => console.error(err));
        }

        setInterval(fetchTrafficData, 2000);
        fetchTrafficData();

        document.getElementById('nodeSearch').addEventListener('input', fetchTrafficData);
        document.getElementById('filterPedestrians').addEventListener('change', fetchTrafficData);
        document.getElementById('filterCyclists').addEventListener('change', fetchTrafficData);
        document.getElementById('filterAmbulances').addEventListener('change', fetchTrafficData);
    </script>
</body>
</html>
