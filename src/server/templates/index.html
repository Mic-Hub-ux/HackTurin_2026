<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crossing - Turin Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
        }
        #sidebar {
            width: 340px;
            background: #ffffff;
            padding: 24px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            overflow-y: auto;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        h2 {
            margin-top: 0;
            color: #1d1d1f;
            font-size: 1.5rem;
            font-weight: 700;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .filter-group label {
            font-weight: 600;
            color: #48484a;
            font-size: 0.9rem;
        }
        .filter-group input[type="text"] {
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fbfbfd;
        }
        .filter-group input[type="text"]:focus {
            border-color: #0071e3;
        }
        
        /* iPhone-style Toggle Switch */
        .toggle-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f5f5f7;
            padding: 10px 14px;
            border-radius: 12px;
        }
        .toggle-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1d1d1f;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 51px;
            height: 31px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e5e5ea;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 31px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 27px;
            width: 27px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        input:checked + .slider {
            background-color: #34c759; /* iOS Green */
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .stats-box {
            background: #f5f5f7;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            color: #86868b;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Right Sidebar for Controls & Filters -->
    <div id="sidebar">
        <h2>Smart Turin</h2>
        <div class="stats-box">
            Real-time urban monitoring dashboard tracking pedestrian, cyclist, and emergency flows across active peer nodes.
        </div>

        <div class="filter-group">
            <label for="nodeSearch">Search Peer ID</label>
            <input type="text" id="nodeSearch" placeholder="e.g. node_01">
        </div>

        <div class="filter-group">
            <label>Traffic Categories</label>
            <div class="toggle-container">
                <div class="toggle-row">
                    <span class="toggle-label">🚶 Pedestrians</span>
                    <label class="switch">
                        <input type="checkbox" id="filterPedestrians" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">🚴 Cyclists</span>
                    <label class="switch">
                        <input type="checkbox" id="filterCyclists" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">🚑 Ambulances</span>
                    <label class="switch">
                        <input type="checkbox" id="filterAmbulances" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Left Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([45.0703, 7.6869], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markers = {};

        function fetchTrafficData() {
            fetch('/api/traffic')
                .then(response => response.json())
                .then(data => {
                    const searchQuery = document.getElementById('nodeSearch').value.toLowerCase();
                    const showPed = document.getElementById('filterPedestrians').checked;
                    const showCyc = document.getElementById('filterCyclists').checked;
                    const showAmb = document.getElementById('filterAmbulances').checked;

                    data.forEach(node => {
                        const nodeId = node.node_id.toLowerCase();
                        
                        if (searchQuery && !nodeId.includes(searchQuery)) {
                            if (markers[node.node_id]) {
                                map.removeLayer(markers[node.node_id]);
                                delete markers[node.node_id];
                            }
                            return;
                        }

                        const lat = node.coordinates.lat;
                        const lon = node.coordinates.lon;
                        const counts = node.counts;

                        let metricsHtml = `<b>Node ID:</b> ${node.node_id}<br><hr style="margin: 5px 0; border:0; border-top:1px solid #ddd;">`;
                        if (showPed) metricsHtml += `🚶 Pedestrians: <b>${counts.pedestrians}</b><br>`;
                        if (showCyc) metricsHtml += `🚴 Cyclists: <b>${counts.cyclists}</b><br>`;
                        if (showAmb) metricsHtml += `🚑 Ambulances: <b>${counts.ambulances}</b><br>`;

                        if (markers[node.node_id]) {
                            markers[node.node_id].setLatLng([lat, lon]);
                            const popup = markers[node.node_id].getPopup();
                            if (popup) {
                                popup.setContent(metricsHtml);
                            }
                        } else {
                            const marker = L.marker([lat, lon]).addTo(map);
                            marker.bindPopup(metricsHtml);

                            marker.on('mouseover', function () {
                                this.openPopup();
                            });
                            marker.on('mouseout', function () {
                                this.closePopup();
                            });

                            markers[node.node_id] = marker;
                        }
                    });
                })
                .catch(error => console.error('Error fetching traffic data:', error));
        }

        setInterval(fetchTrafficData, 2000);
        fetchTrafficData();

        document.getElementById('nodeSearch').addEventListener('input', fetchTrafficData);
        document.getElementById('filterPedestrians').addEventListener('change', fetchTrafficData);
        document.getElementById('filterCyclists').addEventListener('change', fetchTrafficData);
        document.getElementById('filterAmbulances').addEventListener('change', fetchTrafficData);
    </script>
</body>
</html>
