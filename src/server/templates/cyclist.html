<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Crossing - Cyclist View</title>
    <!-- Custom External CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='cyclist.css') }}">
</head>
<body>

    <div class="container">
       <header>
    <div class="header-center">
        <h1>Efesto</h1>
        <div class="subtitle"> Safety Assistant</div>
    </div>
    <button id="themeToggleBtn" class="theme-toggle-btn" title="Switch Day/Night Mode">🌙</button>
</header>

        <!-- Node Selector -->
        <div class="node-select-box">
            <label for="nodeSelect">Approaching Intersection / Node</label>
            <select id="nodeSelect">
                <option value="node_01">Node 01 (Via Po)</option>
                <option value="node_02">Node 02 (Via Roma)</option>
                <option value="node_03">Node 03 (Corso Vittorio)</option>
                <option value="node_04">Node 04 (Piazza Castello)</option>
            </select>
        </div>

        <!-- Dynamic Safety Alert Box -->
        <div id="alertBanner">🟢 Approaching Safe</div>

        <!-- Live Numbers Grid -->
        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-title">🚶 Pedestrians</div>
                <div class="metric-value" id="valPedestrians">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">🚴 Cyclists</div>
                <div class="metric-value" id="valCyclists">-</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">🚑 Ambulances</div>
                <div class="metric-value" id="valAmbulances" style="color: #ff3b30;">-</div>
            </div>
        </div>
    </div>

    <script>
        const nodeSelect = document.getElementById('nodeSelect');
        const alertBanner = document.getElementById('alertBanner');
        const valPedestrians = document.getElementById('valPedestrians');
        const valCyclists = document.getElementById('valCyclists');
        const valAmbulances = document.getElementById('valAmbulances');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // Theme Toggle Logic
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeToggleBtn.textContent = "☀️"; // Switch icon to sun for day mode option
            } else {
                themeToggleBtn.textContent = "🌙"; // Switch icon to moon for night mode option
            }
        });

        function fetchNodeData() {
            const selectedNode = nodeSelect.value;

            fetch(`/api/traffic/${selectedNode}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Node data unavailable");
                    }
                    return response.json();
                })
                .then(data => {
                    const counts = data.counts;
                    valPedestrians.textContent = counts.pedestrians;
                    valCyclists.textContent = counts.cyclists;
                    valAmbulances.textContent = counts.ambulances;

                    // Safety Logic & Alert Generation
                    if (counts.ambulances > 0) {
                        alertBanner.style.backgroundColor = "#ff3b30"; // Red
                        alertBanner.style.color = "#ffffff";
                        alertBanner.innerHTML = "🚨 WARNING: Ambulance Approaching!";
                    } else if (counts.pedestrians > 12) {
                        alertBanner.style.backgroundColor = "#ff9500"; // Orange
                        alertBanner.style.color = "#ffffff";
                        alertBanner.innerHTML = "⚠️ Caution: High Pedestrian Traffic";
                    } else {
                        alertBanner.style.backgroundColor = "#34c759"; // Green
                        alertBanner.style.color = "#ffffff";
                        alertBanner.innerHTML = "🟢 Intersection Clear / Safe";
                    }
                })
                .catch(error => {
                    alertBanner.style.backgroundColor = "#86868b";
                    alertBanner.style.color = "#ffffff";
                    alertBanner.innerHTML = "⏳ Waiting for Node Signal...";
                    valPedestrians.textContent = "-";
                    valCyclists.textContent = "-";
                    valAmbulances.textContent = "-";
                });
        }

        // Poll every 1.5 seconds for instant updates
        setInterval(fetchNodeData, 1500);
        nodeSelect.addEventListener('change', fetchNodeData);
        fetchNodeData();
    </script>
</body>
</html>
